<div class="cp-page">
  <div class="cp-card">

    <!-- Header -->
    <div class="cp-header">
      <span class="cp-icon">🔒</span>
      <div>
        <h2 class="cp-title">Change Password</h2>
        <p class="cp-sub">Update your account password</p>
      </div>
    </div>

    <!-- Body -->
    <div class="cp-body">

      <div class="alert-success" *ngIf="successMsg">{{ successMsg }}</div>
      <div class="alert-error"   *ngIf="errorMsg">❌ {{ errorMsg }}</div>

      <div class="field">
        <label class="field-label">Current Password <span class="req">*</span></label>
        <div class="password-input-wrap">
          <input class="field-input" [type]="showCurrentPassword ? 'text' : 'password'"
                 [(ngModel)]="currentPassword" placeholder="Enter current password" />
          <button class="password-toggle" type="button"
                  [attr.aria-label]="showCurrentPassword ? 'Hide current password' : 'Show current password'"
                  [attr.title]="showCurrentPassword ? 'Hide password' : 'Show password'"
                  (click)="showCurrentPassword = !showCurrentPassword">
            <svg *ngIf="!showCurrentPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showCurrentPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">New Password <span class="req">*</span></label>
        <div class="password-input-wrap">
          <input class="field-input" [type]="showNewPassword ? 'text' : 'password'"
                 [(ngModel)]="newPassword" placeholder="Min. 6 characters" />
          <button class="password-toggle" type="button"
                  [attr.aria-label]="showNewPassword ? 'Hide new password' : 'Show new password'"
                  [attr.title]="showNewPassword ? 'Hide password' : 'Show password'"
                  (click)="showNewPassword = !showNewPassword">
            <svg *ngIf="!showNewPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showNewPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Confirm New Password <span class="req">*</span></label>
        <div class="password-input-wrap">
          <input class="field-input" [type]="showConfirmPassword ? 'text' : 'password'"
                 [(ngModel)]="confirmPassword" placeholder="Repeat new password" />
          <button class="password-toggle" type="button"
                  [attr.aria-label]="showConfirmPassword ? 'Hide confirmed password' : 'Show confirmed password'"
                  [attr.title]="showConfirmPassword ? 'Hide password' : 'Show password'"
                  (click)="showConfirmPassword = !showConfirmPassword">
            <svg *ngIf="!showConfirmPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showConfirmPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="cp-footer">
      <button class="btn-cancel" (click)="cancel()">Cancel</button>
      <button class="btn-submit"
              [disabled]="!currentPassword || !newPassword || !confirmPassword || loading"
              (click)="submit()">
        <span *ngIf="!loading">Update Password</span>
        <span *ngIf="loading">Updating…</span>
      </button>
    </div>

  </div>
</div>
