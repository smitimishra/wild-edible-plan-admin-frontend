<div class="otp-page">
  <div class="otp-card">

    <!-- Header -->
    <div class="otp-header">
      <span class="otp-icon">📱</span>
      <h2 class="otp-title">OTP Verification</h2>
      <p class="otp-sub">
        A 6-digit OTP was sent to your registered email
        <strong *ngIf="phoneMasked"> {{ phoneMasked }}</strong>
      </p>
    </div>

    <!-- Dev hint: show OTP for testing -->
    <div class="dev-hint" *ngIf="devOtp">
      OTP
    </div>

    <!-- Body -->
    <div class="otp-body">

      <div class="greeting" *ngIf="userName">
        Hello, <strong>{{ userName }}</strong> 👋
      </div>

      <!-- Error -->
      <div class="alert-error" *ngIf="errorMsg">❌ {{ errorMsg }}</div>

      <!-- OTP input -->
      <div class="field">
        <label class="field-label">Enter OTP <span class="req">*</span></label>
        <input class="otp-input" type="text" [(ngModel)]="otpCode"
               maxlength="6" placeholder="_ _ _ _ _ _"
               (keyup.enter)="verify()" />
      </div>

      <button class="btn-verify"
              [disabled]="otpCode.length < 6 || loading"
              (click)="verify()">
        <span *ngIf="!loading">Verify OTP</span>
        <span *ngIf="loading">Verifying…</span>
      </button>

      <button class="btn-back" (click)="back()">← Back to Login</button>

    </div>
  </div>
</div>


<!-- ============================================================ -->
<!-- ACTIVE SESSION POPUP                                         -->
<!-- Shown when the same user is already logged in elsewhere      -->
<!-- ============================================================ -->

<div class="session-backdrop" *ngIf="showActiveSessionPopup">
  <div class="session-popup">

    <!-- Icon -->
    <div class="session-popup-icon">⚠️</div>

    <!-- Title -->
    <h3 class="session-popup-title">Already Logged In</h3>

    <!-- Message -->
    <p class="session-popup-msg">
      Your account is currently active on another device or browser.<br/>
      Click <strong>OK</strong> to log out from that device and continue here.
    </p>

    <!-- Buttons -->
    <div class="session-popup-actions">

      <!-- OK -->
      <button
        class="btn-popup-ok"
        [disabled]="activeSessionPopupLoading"
        (click)="forceLogoutAndReVerify()"
      >
        <span *ngIf="!activeSessionPopupLoading">OK</span>
        <span *ngIf="activeSessionPopupLoading" class="spinner"></span>
      </button>

      <!-- Cancel -->
      <button
        class="btn-popup-cancel"
        [disabled]="activeSessionPopupLoading"
        (click)="closeActiveSessionPopup()"
      >
        Cancel
      </button>

    </div>

  </div>
</div>
