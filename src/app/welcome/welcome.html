<div class="welcome-page">
  <div class="welcome-card">

    <!-- Brand -->
    <div class="brand">
      <span class="brand-icon">🌿</span>
      <h1 class="brand-title">Web GIS Plant Portal</h1>
      <p class="brand-sub">Wild Edible Plant Database & GIS System</p>
    </div>

    <!-- Step 1: Role selection from API -->
    <div class="section-label">Select your role</div>

    <!-- Loading -->
    <div class="roles-loading" *ngIf="rolesLoading">
      <span class="spinner-sm"></span> Loading roles…
    </div>

    <!-- Role chips — one line, from role_table API -->
    <div class="role-row" *ngIf="!rolesLoading">
      <label
        *ngFor="let r of roles"
        class="role-option"
        [class.active]="selectedRole === r.roleName"
      >
        <input type="radio" name="role"
               [value]="r.roleName"
               [(ngModel)]="selectedRole"
               (change)="selectRole(r.roleName)" />
        <span class="radio-circle"></span>
        <span class="role-name-text">{{ r.roleName }}</span>
      </label>
    </div>

    <!-- Hint before role selected -->
    <div class="hint-msg" *ngIf="!formVisible && !rolesLoading">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
      </svg>
      Please select a role above to proceed with login
    </div>

    <!-- Step 2: Login form (appears after role selected) -->
    <div class="login-form" *ngIf="formVisible">

      <div class="form-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#14532d">
          <path d="M12 12c2.7 0 4-1.8 4-4s-1.3-4-4-4-4 1.8-4 4 1.3 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/>
        </svg>
        Logging in as <strong>{{ selectedRole }}</strong>
      </div>

      <div class="alert-error" *ngIf="errorMsg">❌ {{ errorMsg }}</div>
      <div class="field">
        <label class="field-label">Email ID <span class="req">*</span></label>
        <input class="field-input" type="email" [(ngModel)]="emailId"
               placeholder="e.g. admin@test.com" (ngModelChange)="onEmailChange()"
               (keyup.enter)="login()" />
      </div>

      <div class="field">
        <label class="field-label">Password <span class="req">*</span></label>
        <div class="input-eye-wrap">
          <input class="field-input" [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="password"
                 placeholder="Enter your password" />
          <button type="button" class="eye-btn" (click)="showPassword = !showPassword"
                  [title]="showPassword ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-login"
              [disabled]="!emailId.trim() || !password || loading || isLocked"
              (click)="login()">
        <span *ngIf="!loading">Login →</span>
        <span *ngIf="loading">Verifying…</span>
      </button>

      <!-- Forgot Password link -->
      <div class="forgot-row">
        <a class="forgot-link" routerLink="/forgot-password">Forgot Password?</a>
      </div>

    </div>

  </div>
</div>
