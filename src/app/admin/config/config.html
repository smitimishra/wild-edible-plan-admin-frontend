<div class="page-header">
  <div>
    <h2 class="page-title">System Configuration</h2>
    <span class="page-sub">Manage portal and security settings</span>
  </div>
</div>

<div class="card config-card">
  <div class="config-section">
    <h4 class="section-title">API Settings</h4>
    <div class="form-row">
      <label>API Base URL</label>
      <input type="text" [(ngModel)]="settings.apiBase" />
    </div>
    <div class="form-row">
      <label>GIS Server URL</label>
      <input type="text" [(ngModel)]="settings.gisServerUrl" />
    </div>
  </div>

  <div class="config-section">
    <h4 class="section-title">Security</h4>
    <div class="form-row">
      <label>Session Timeout (minutes)</label>
      <input type="number" [(ngModel)]="settings.sessionTimeout" min="5" max="120" />
    </div>
    <div class="form-row">
      <label>Max Upload Size (MB)</label>
      <input type="number" [(ngModel)]="settings.maxUploadMb" min="1" max="100" />
    </div>
    <div class="form-row toggle-row">
      <label>Data Encryption (AES-256)</label>
      <label class="toggle">
        <input type="checkbox" [(ngModel)]="settings.encryptionEnabled" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="form-row toggle-row">
      <label>Audit Logging</label>
      <label class="toggle">
        <input type="checkbox" [(ngModel)]="settings.auditEnabled" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="config-footer">
    <div class="saved-msg" *ngIf="saved">✅ Settings saved successfully</div>
    <button class="btn-primary" (click)="save()">Save Settings</button>
  </div>
</div>
