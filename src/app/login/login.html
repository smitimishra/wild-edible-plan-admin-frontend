<div class="login-page">
  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <button class="back-btn" (click)="back()" title="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <span class="header-icon">🔑</span>
      <div>
        <h2 class="header-title">User Login</h2>
        <p class="header-sub">Enter your Email and Phone to continue</p>
      </div>
    </div>

    <!-- Body -->
    <div class="login-body">

      <!-- Error -->
      <div class="alert error" *ngIf="errorMsg">❌ {{ errorMsg }}</div>

      <!-- Email -->
      <div class="field">
        <label class="field-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          Email ID <span class="req">*</span>
        </label>
        <input class="field-input" type="email" [(ngModel)]="emailId"
               placeholder="e.g. sunita@example.com"
               (keyup.enter)="login()" />
      </div>

      <!-- Phone -->
      <div class="field">
        <label class="field-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
          </svg>
          Phone Number <span class="req">*</span>
        </label>
        <input class="field-input" type="tel" [(ngModel)]="phoneNumber"
               placeholder="e.g. 9876543210"
               (keyup.enter)="login()" />
      </div>

    </div>

    <!-- Footer -->
    <div class="login-footer">
      <button class="btn-login"
              [disabled]="!emailId.trim() || !phoneNumber.trim() || loading"
              (click)="login()">
        <span *ngIf="!loading">🔑 Login</span>
        <span *ngIf="loading">Verifying…</span>
      </button>
    </div>

  </div>
</div>
